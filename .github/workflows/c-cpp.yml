name: C/C++ CI

on:
  push:
    branches: [ "001-implement-puzzle71solver-mred", "phase5-memory-optimization" ]
  pull_request:
    branches: [ "001-implement-puzzle71solver-mred", "phase5-memory-optimization" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential cuda-cudart-dev-12-0

    - name: Create build directory
      run: mkdir -p build

    - name: Configure with CMake
      run: |
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure

    - name: Run benchmarks
      run: |
        cd build
        if [ -f ./Puzzle71Solver ]; then
          echo "Running basic performance test..."
          timeout 30s ./Puzzle71Solver --help || echo "Basic test completed"
        fi
